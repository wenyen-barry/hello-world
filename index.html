<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Access</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        video {
            max-width: 100%;
            width: 500px;
            height: 400px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #000;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
        .api-key-section {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }
        .api-key-section input {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 300px;
            margin: 0 10px;
        }
        #uploadedImage {
            max-width: 100%;
            max-height: 300px;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
        }
        #imageLink {
            margin-top: 10px;
        }
        #imageLink a {
            color: #4CAF50;
            text-decoration: none;
        }
        #imageLink a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Webcam Access Demo</h1>
        <div class="api-key-section">
            <label for="imgbbKey">Imgbb API Key:</label>
            <input type="text" id="imgbbKey" placeholder="Paste your imgbb API key here" value="d64646806d96af514bc91c549d2852d9" disabled>
        </div>
        <div style="margin-bottom: 20px;">
            <label for="deviceSelect">Select Camera:</label>
            <select id="deviceSelect" style="padding: 8px; font-size: 14px; border-radius: 5px; border: 1px solid #ccc;">
                <option value="">-- Loading cameras --</option>
            </select>
        </div>
        <video id="video" autoplay playsinline></video>
        <br>
        <button id="startBtn">Start Webcam</button>
        <button id="stopBtn" disabled>Stop Webcam</button>
        <button id="photoBtn" disabled>Take Photo</button>
        <div id="status">Ready to start</div>
        <canvas id="canvas" style="display: none;"></canvas>
        <img id="uploadedImage" alt="Uploaded photo">
        <div id="imageLink"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const photoBtn = document.getElementById('photoBtn');
        const status = document.getElementById('status');
        const deviceSelect = document.getElementById('deviceSelect');
        const canvas = document.getElementById('canvas');
        const imgbbKeyInput = document.getElementById('imgbbKey');
        const uploadedImage = document.getElementById('uploadedImage');
        const imageLink = document.getElementById('imageLink');
        let stream = null;

        // Enumerate and populate available video devices
        async function loadVideoDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');

                deviceSelect.innerHTML = '';

                if (videoDevices.length === 0) {
                    deviceSelect.innerHTML = '<option value="">No cameras found</option>';
                    return;
                }

                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    // Show device label if available, otherwise show generic name
                    option.textContent = device.label || `Camera ${index + 1}`;
                    deviceSelect.appendChild(option);
                });

                // Select the first device by default
                if (videoDevices.length > 0) {
                    deviceSelect.value = videoDevices[0].deviceId;
                }
            } catch (error) {
                console.error('Error enumerating devices:', error);
                deviceSelect.innerHTML = '<option value="">Error loading cameras</option>';
            }
        }

        // Load devices when page loads
        loadVideoDevices();

        // Reload devices when device list changes (camera connected/disconnected)
        navigator.mediaDevices.addEventListener('devicechange', loadVideoDevices);

        startBtn.addEventListener('click', async () => {
            try {
                const selectedDeviceId = deviceSelect.value;

                if (!selectedDeviceId) {
                    status.textContent = 'Please select a camera first';
                    status.className = 'error';
                    return;
                }

                // Request access to the webcam with selected device
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { deviceId: { exact: selectedDeviceId } },
                    audio: false
                });

                // Display the stream in the video element
                video.srcObject = stream;

                // Update UI
                startBtn.disabled = true;
                stopBtn.disabled = false;
                photoBtn.disabled = false;
                deviceSelect.disabled = true;
                status.textContent = 'Webcam is running';
                status.className = 'success';
            } catch (error) {
                console.error('Error accessing webcam:', error);
                status.textContent = `Error: ${error.message}`;
                status.className = 'error';
            }
        });

        stopBtn.addEventListener('click', () => {
            // Stop all tracks
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            // Clear video element
            video.srcObject = null;

            // Update UI
            startBtn.disabled = false;
            stopBtn.disabled = true;
            photoBtn.disabled = true;
            deviceSelect.disabled = false;
            status.textContent = 'Webcam stopped';
            status.className = '';
        });

        photoBtn.addEventListener('click', async () => {
            if (!video.srcObject) {
                status.textContent = 'No active webcam stream';
                status.className = 'error';
                return;
            }

            if (!imgbbKeyInput.value.trim()) {
                status.textContent = 'Please enter your imgbb API key first';
                status.className = 'error';
                return;
            }

            try {
                status.textContent = 'Capturing and uploading...';
                status.className = '';

                // Set canvas dimensions to match video
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                // Draw current video frame to canvas
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Convert canvas to blob
                canvas.toBlob(async (blob) => {
                    try {
                        // Create FormData for imgbb upload
                        const formData = new FormData();
                        formData.append('image', blob, 'photo.jpg');

                        // Upload to imgbb
                        const response = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbKeyInput.value.trim()}`, {
                            method: 'POST',
                            body: formData
                        });

                        if (!response.ok) {
                            throw new Error(`Upload failed: ${response.statusText}`);
                        }

                        const result = await response.json();

                        if (!result.success) {
                            throw new Error(result.error?.message || 'Upload failed');
                        }

                        // Display uploaded image
                        uploadedImage.src = result.data.url;
                        uploadedImage.style.display = 'block';
                        imageLink.innerHTML = `<a href="${result.data.url}" target="_blank">View full image</a>`;

                        status.textContent = 'Photo uploaded successfully!';
                        status.className = 'success';
                    } catch (error) {
                        console.error('Upload error:', error);
                        status.textContent = `Upload error: ${error.message}`;
                        status.className = 'error';
                    }
                }, 'image/jpeg', 0.9);
            } catch (error) {
                console.error('Photo capture error:', error);
                status.textContent = `Error: ${error.message}`;
                status.className = 'error';
            }
        });

        // Clean up when page unloads
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
